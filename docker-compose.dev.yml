name: neurorift

services:
  neurorift-core:
    build:
      target: base
    volumes:
      - ./modules:/app/modules
      - ./utils:/app/utils
      - ./prompts:/app/prompts
      - ./configs:/app/configs
      - ./ai_wrapper:/app/ai_wrapper
    environment:
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:8766:8766"
    command: >
      uvicorn modules.web.bridge_server:app --host 0.0.0.0 --port 8766 --reload --log-level debug

  rust-engine:
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      RUST_LOG: debug

  gateway:
    ports:
      - "127.0.0.1:18789:18789"

  web-ui:
    build:
      target: builder
    volumes:
      - ./web-ui:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    command: npm run dev

  ollama:
    ports:
      - "127.0.0.1:11434:11434"
