name: neurorift

volumes:
  ollama_models:
  neurorift_sessions:
  neurorift_audit:
  neurorift_evolution:
  gateway_state:

networks:
  neurorift_net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks: [neurorift_net]
    volumes:
      - ollama_models:/root/.ollama
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  neurorift-core:
    build:
      context: .
      dockerfile: docker/neurorift/Dockerfile
    image: neurorift/bridge:latest
    restart: unless-stopped
    networks: [neurorift_net]
    expose: ["8766"]
    volumes:
      - neurorift_sessions:/data/neurorift/sessions
      - neurorift_audit:/data/neurorift/audit
      - neurorift_evolution:/data/neurorift/evolution
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8766"
      NEURORIFT_HOME: "/data/neurorift"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8766/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  rust-engine:
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
    image: neurorift/openclaw:latest
    restart: unless-stopped
    networks: [neurorift_net]
    expose: ["8765"]
    environment:
      NEURORIFT_HOME: "/data/neurorift"
      NEURORIFT_WS_ADDR: "0.0.0.0:8765"
      NEURORIFT_BRIDGE_URL: "http://neurorift-core:8766"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - neurorift_sessions:/data/neurorift/sessions
    depends_on:
      neurorift-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8765/health 2>/dev/null || (echo >/dev/tcp/localhost/8765) 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  gateway:
    image: neurorift/openclaw:latest
    restart: unless-stopped
    networks: [neurorift_net]
    expose: ["18789"]
    volumes:
      - gateway_state:/data/openclaw
      - neurorift_sessions:/data/neurorift/sessions
    environment:
      OPENCLAW_CONFIG_PATH: /workspace/NeuroRift/openclaw.json5
      OPENCLAW_STATE_DIR: /data/openclaw
      OPENCLAW_GATEWAY_ADDR: "0.0.0.0:18789"
      NEURORIFT_BRIDGE_URL: "http://neurorift-core:8766"
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      neurorift-core:
        condition: service_healthy
      rust-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo >/dev/tcp/localhost/18789"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sandbox-runner:
    image: openclaw-sandbox:bookworm-slim
    restart: unless-stopped
    networks: [neurorift_net]
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "sh", "-c", "echo sandbox-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-ui:
    build:
      context: .
      dockerfile: docker/web-ui/Dockerfile
      args:
        NEURORIFT_BRIDGE_URL: "http://neurorift-core:8766"
        OPENCLAW_WS_URL: "http://gateway:18789"
    image: neurorift/web-ui:latest
    restart: unless-stopped
    networks: [neurorift_net]
    ports:
      - "${WEB_UI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEURORIFT_BRIDGE_URL: "http://neurorift-core:8766"
      OPENCLAW_WS_URL: "http://gateway:18789"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
